name: "WinCC OA Create Project Config"
description: "Create and configure a WinCC OA project configuration file with language support"
author: "winccoa-tools-pack"

inputs:
  project-path:
    description: "Path to the WinCC OA project directory or space-separated paths for multiple projects (e.g., src/Squirt or 'addons/plugin1 src/Squirt')"
    required: true

  languages:
    description: "Languages to configure, space-separated full locale names (e.g., en_US.utf8 de_AT.utf8)"
    required: true

  winccoa-version:
    description: "WinCC OA version (e.g., 3.21)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Create project configuration
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project-path }}
        LANGUAGES: ${{ inputs.languages }}
        WINCCOA_VERSION: ${{ inputs.winccoa-version }}
        PMON_PORT: ${{ inputs.pmon-port }}
      run: |
        set -euo pipefail
        
        WINCCOA_BIN="/opt/WinCC_OA/${WINCCOA_VERSION}/bin"
        PROJECT_PATH="${GITHUB_WORKSPACE}/${PROJECT_PATH}"
        CONFIG_DIR="${PROJECT_PATH}/config"
        CONFIG_FILE="${CONFIG_DIR}/config"
        
        echo "Creating project configuration..."
        echo "  Project path: ${PROJECT_PATH}"
        echo "  Config directory: ${CONFIG_DIR}"
        echo "  Languages: ${LANGUAGES}"
        echo "  WinCC OA version: ${WINCCOA_VERSION}"
        echo "  PMON port: ${PMON_PORT}"
        
        # Create config directory
        mkdir -p "${CONFIG_DIR}"
        
        # Create config file
        cat > "${CONFIG_FILE}" <<EOF
        [general]
        pvss_path = "/opt/WinCC_OA/${WINCCOA_VERSION}"
        proj_version = "${WINCCOA_VERSION}"
        EOF
        
        # Add proj_path lines (one per project path)
        for proj in ${PROJECT_PATH}; do
          echo "proj_path = \"${GITHUB_WORKSPACE}/${proj}\"" >> "${CONFIG_FILE}"
        done
        
        # Add langs lines (one per language)
        for lang in ${LANGUAGES}; do
          echo "langs = \"${lang}\"" >> "${CONFIG_FILE}"
        done
        
        echo "Config file created at: ${CONFIG_FILE}"
        cat "${CONFIG_FILE}"
        
        # Create log directory
        mkdir -p "${PROJECT_PATH}/log"
        
        # Register the project using WCCILpmon
        echo "Registering project with WCCILpmon..."
        cd "${PROJECT_PATH}"
        
        "${WINCCOA_BIN}/WCCILpmon" \
          -config "${CONFIG_FILE}" \
          -n \
          -autofreg \
          -status \
          -log +stderr || {
          EXIT_CODE=$?
          echo "::warning::WCCILpmon exited with code ${EXIT_CODE}. This may be expected if the system manager is not running."
        }
        
        echo "Project configuration completed successfully."
