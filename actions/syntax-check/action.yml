name: "WinCC OA Syntax Check"
description: "Run WinCC OA syntax validation using @winccoa-tools-pack/npm-winccoa-syntax-check inside a WinCC OA Docker image"
author: "winccoa-tools-pack"

inputs:
  path:
    description: "Path to WinCC OA project root relative to the repository root"
    required: false
    default: "."

  fail-on-error:
    description: "Fail workflow on syntax errors"
    required: false
    default: "true"

  docker-image:
    description: "GHCR WinCC OA image to run the check in"
    required: false
    default: "ghcr.io/winccoa-tools-pack/winccoa:latest"

  winccoa-version:
    description: "WinCC OA version installed in the image, for example 3.21"
    required: true

  config:
    description: "Path to the project config file relative to the repository root. If empty, defaults to <path>/config/config"
    required: false
    default: ""

  mode:
    description: "Check mode: all, scripts, panels"
    required: false
    default: "all"

  integrity:
    description: "If true, performs integrity check"
    required: false
    default: "false"

  timeout-ms:
    description: "Timeout in milliseconds"
    required: false
    default: "60000"

  node-version:
    description: "Node.js version used when node/npm are missing in the image"
    required: false
    default: "20.17.0"

outputs:
  error-count:
    description: "Number of detected syntax errors"
    value: ${{ steps.run.outputs.error-count }}

runs:
  using: "composite"
  steps:
    - name: Run syntax check in container
      id: run
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_CONFIG: ${{ inputs.config }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        DOCKER_IMAGE: ${{ inputs.docker-image }}
        OA_VERSION: ${{ inputs.winccoa-version }}
        MODE: ${{ inputs.mode }}
        INTEGRITY: ${{ inputs.integrity }}
        TIMEOUT_MS: ${{ inputs.timeout-ms }}
        NODE_VERSION: ${{ inputs.node-version }}
      run: |
        set -euo pipefail

        PROJECT_PATH="${INPUT_PATH#./}"
        if [ -z "$PROJECT_PATH" ]; then
          PROJECT_PATH="."
        fi

        if [ -n "$INPUT_CONFIG" ]; then
          CONFIG_PATH="${INPUT_CONFIG#./}"
        elif [ "$PROJECT_PATH" = "." ]; then
          CONFIG_PATH="config/config"
        else
          CONFIG_PATH="$PROJECT_PATH/config/config"
        fi

        if [ ! -f "$GITHUB_WORKSPACE/$CONFIG_PATH" ]; then
          echo "::notice::Config file not found at '$CONFIG_PATH'. A temporary config will be generated."
        fi

        set +e
        CONTAINER_SCRIPT=$(cat <<'BASH'
            set -euo pipefail

            install_node() {
              local arch
              case "$(uname -m)" in
                x86_64) arch="x64" ;;
                aarch64|arm64) arch="arm64" ;;
                *)
                  echo "::error::Unsupported architecture for node install: $(uname -m)"
                  return 1
                  ;;
              esac

              local version="${NODE_VERSION}"
              case "$version" in
                v*) ;;
                *) version="v${version}" ;;
              esac

              local tarball="node-${version}-linux-${arch}.tar.xz"
              local url="https://nodejs.org/dist/${version}/${tarball}"
              local tmp_dir
              tmp_dir="$(mktemp -d)"

              if command -v curl >/dev/null 2>&1; then
                curl -fsSL "$url" -o "$tmp_dir/$tarball"
              elif command -v wget >/dev/null 2>&1; then
                wget -qO "$tmp_dir/$tarball" "$url"
              else
                echo "::error::Neither curl nor wget available to download Node.js"
                rm -rf "$tmp_dir"
                return 1
              fi

              tar -xJf "$tmp_dir/$tarball" -C "$tmp_dir"
              cp -R "$tmp_dir/node-${version}-linux-${arch}/." /usr/local/
              rm -rf "$tmp_dir"
            }

            if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
              install_node
            fi

            if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
              echo "::error::node/npm installation failed in image"
              exit 127
            fi

            OA_PATH="/opt/WinCC_OA/${OA_VERSION}"
            PROJ_PATH="/workspace/${PROJECT_PATH}"
            CONFIG_SRC="/workspace/${CONFIG_PATH}"
            CONFIG_TMP="/tmp/winccoa-config"
            CREATE_DB_BIN="$OA_PATH/bin/WCCOAtoolCreateDbSQLite"
            PMON_BIN="$OA_PATH/bin/WCCILpmon"

            mkdir -p "$PROJ_PATH/config"

            if [ -f "$CONFIG_SRC" ]; then
              cp "$CONFIG_SRC" "$CONFIG_TMP"
              sed -i "s|<WinCC_OA_PATH>|$OA_PATH|g; s|<WinCC_OA_VERSION>|$OA_VERSION|g; s|<PROJECT_PATH>|$PROJ_PATH|g" "$CONFIG_TMP" || true
            else
              printf '%s\n' \
                '[general]' \
                "pvss_path = \"$OA_PATH\"" \
                "proj_path = \"$PROJ_PATH\"" \
                "proj_version = \"${OA_VERSION}\"" \
                'langs = "de_AT.utf8"' \
                'langs = "en_US.utf8"' \
                'pmonPort = 5999' \
                > "$CONFIG_TMP"
            fi

            if [ -x "$PMON_BIN" ]; then
              "$PMON_BIN" -config "$CONFIG_TMP" -n -autofreg -status -log +stderr || true
            fi

            if [ -x "$CREATE_DB_BIN" ]; then
              "$CREATE_DB_BIN" -config "$CONFIG_TMP" -empty -yes
            fi

            npm install -g @winccoa-tools-pack/npm-winccoa-syntax-check@latest

            ARGS=("-v" "$OA_VERSION" "-c" "$CONFIG_TMP" "-m" "$MODE" "-t" "$TIMEOUT_MS")
            if [ "$INTEGRITY" = "true" ]; then
              ARGS+=("-i")
            fi

            winccoa-syntax-check "${ARGS[@]}"
        BASH
        )

        STDOUT_FILE=$(mktemp)
        STDERR_FILE=$(mktemp)

        docker run --rm \
          --user root \
          --shm-size=2g \
          -v "$GITHUB_WORKSPACE":"/workspace":rw \
          -w "/workspace" \
          -e OA_VERSION="$OA_VERSION" \
          -e PROJECT_PATH="$PROJECT_PATH" \
          -e CONFIG_PATH="$CONFIG_PATH" \
          -e MODE="$MODE" \
          -e INTEGRITY="$INTEGRITY" \
          -e TIMEOUT_MS="$TIMEOUT_MS" \
          -e NODE_VERSION="$NODE_VERSION" \
          "$DOCKER_IMAGE" \
          bash -lc "$CONTAINER_SCRIPT" \
          >"$STDOUT_FILE" 2>"$STDERR_FILE"
        EXIT_CODE=$?
        set -e

        STDOUT_TOTAL_LINES=$(wc -l < "$STDOUT_FILE" | tr -d '[:space:]')
        STDERR_TOTAL_LINES=$(wc -l < "$STDERR_FILE" | tr -d '[:space:]')
        PREVIEW_LINES=120

        echo "::group::Syntax check stdout preview (${STDOUT_TOTAL_LINES} lines total, showing up to ${PREVIEW_LINES})"
        sed -n "1,${PREVIEW_LINES}p" "$STDOUT_FILE" || true
        if [ "$STDOUT_TOTAL_LINES" -gt "$PREVIEW_LINES" ]; then
          echo "... truncated ..."
        fi
        echo "::endgroup::"

        echo "::group::Syntax check stderr preview (${STDERR_TOTAL_LINES} lines total, showing up to ${PREVIEW_LINES})"
        sed -n "1,${PREVIEW_LINES}p" "$STDERR_FILE" || true
        if [ "$STDERR_TOTAL_LINES" -gt "$PREVIEW_LINES" ]; then
          echo "... truncated ..."
        fi
        echo "::endgroup::"

        OUTPUT=$(cat "$STDOUT_FILE" "$STDERR_FILE")
        ERROR_COUNT=$(printf '%s\n' "$OUTPUT" | grep -E ".+:[0-9]+:\s+.+" -c || true)
        echo "error-count=$ERROR_COUNT" >> "$GITHUB_OUTPUT"

        rm -f "$STDOUT_FILE" "$STDERR_FILE"

        if [ "$EXIT_CODE" -ne 0 ]; then
          MESSAGE="Syntax check failed (exit $EXIT_CODE). Parsed errors: $ERROR_COUNT"
          if [ "$FAIL_ON_ERROR" = "true" ]; then
            echo "::error::$MESSAGE"
            exit "$EXIT_CODE"
          fi

          echo "::warning::$MESSAGE"
        fi