name: "WinCC OA Docu Builder"
description: >-
  Build WinCC OA project help/docs via
  @winccoa-tools-pack/npm-winccoa-docu-builder (worker + DocuBuilder model)
author: "winccoa-tools-pack"

inputs:
  path:
    description: >-
      Path to the runnable WinCC OA worker / source project root relative to the
      repository root (e.g. src/Squirt)
    required: false
    default: "."

  company-name:
    description: >-
      Company/organization label passed to buildHelp.ctl. Empty defaults to
      GitHub org name, then repository name, then "WinCC OA community".
    required: false
    default: ""

  fail-on-error:
    description: "Fail the job when the docs build fails"
    required: false
    default: "true"

  winccoa-version:
    description: "WinCC OA version installed in the image/host, for example 3.21"
    required: true

  languages:
    description: >-
      Optional newline- or space-separated list of languages for worker project
      registration. Default is en_US.utf8.
    required: false
    default: "en_US.utf8"

  project-docu-paths:
    description: >-
      Optional multi-line (or space/comma-separated) list of external projectDocu
      directories relative to the repository root. Merged into
      <path>/data/projectDocu before the build (left → right: advanced config
      concatenates; other files last-wins). Example: shared theme then project
      .winccoa-docu-builder overrides. When theme-repository is set, the checked
      out theme path is prepended automatically.
    required: false
    default: ""

  theme-repository:
    description: >-
      Optional GitHub repository (owner/name) that holds the shared org
      documentation theme (top-level projectDocu files such as extra_header.html
      and Doxygen Awesome assets). When set, the action checks it out and
      prepends theme-path to project-docu-paths. Example:
      winccoa-tools-pack/docu-builder-theme
    required: false
    default: ""

  theme-ref:
    description: >-
      Git ref (branch, tag, or SHA) for theme-repository. Ignored when
      theme-repository is empty.
    required: false
    default: "main"

  theme-path:
    description: >-
      Workspace-relative path where theme-repository is checked out. Also used
      as the project-docu path entry for the theme.
    required: false
    default: ".docu-builder-theme"

  theme-token:
    description: >-
      Optional token for checking out a private theme-repository. Defaults to
      the job github.token (fine for public org themes).
    required: false
    default: ""

  docker-image:
    description: >-
      Optional container image that contains WinCC OA. When set, registration and
      docs build run inside the same image instance. When empty, the action
      runs on the current runner/container host.
    required: false
    default: ""

  register-project:
    description: >-
      When true (default), the package registers DocuBuilder (non-runnable) and
      the worker project (runnable, DocuBuilder as sub-project) before running.
      Set false only when that registration was already done.
    required: false
    default: "true"

  timeout-ms:
    description: "Timeout in milliseconds for the WCCOActrl process"
    required: false
    default: "600000"

  package-version:
    description: >-
      npm version/dist-tag of @winccoa-tools-pack/npm-winccoa-docu-builder
      (e.g. 0.2.1 or latest), or a full install spec for bootstrap
      (e.g. github:winccoa-tools-pack/npm-winccoa-docu-builder#ref).
      Do not use bare "main".
    required: false
    default: "0.2.1"

  log-path:
    description: >-
      Where to write the captured WCCOActrl/docs log (relative to workspace).
    required: false
    default: ".artifacts/docu-builder.log"

  warning-output-file:
    description: "Path (relative to workspace) where extracted warnings are written."
    required: false
    default: ".artifacts/documentation-warnings.txt"

  install-doc-tooling:
    description: >-
      When true, attempt install of required documentation tooling inside the
      container/host before building.
    required: false
    default: ""

  annotate-warnings:
    description: "Emit parsed warnings as GitHub annotations."
    required: false
    default: "true"

  max-warning-count:
    description: "Maximum allowed warning count; -1 disables threshold enforcement."
    required: false
    default: "-1"

  max-annotations:
    description: "Maximum number of warning annotations to emit."
    required: false
    default: "200"

  install-doxygen:
    description: "Deprecated compatibility alias for install-doc-tooling."
    required: false
    default: ""

  node-version:
    description: "Node.js major version installed when the environment has no Node"
    required: false
    default: "22"

outputs:
  exit-code:
    description: "Process exit code from the docs CLI"
    value: ${{ steps.run.outputs.exit-code }}
  log-path:
    description: "Path to the captured docs-build log file"
    value: ${{ steps.run.outputs.log-path }}
  warning-count:
    description: "Count of extracted warning lines from the docs build output"
    value: ${{ steps.run.outputs.warning-count }}
  warning-file:
    description: "Workspace-relative path to extracted warning lines"
    value: ${{ steps.run.outputs.warning-file }}

runs:
  using: "composite"
  steps:
    - name: Checkout shared documentation theme
      if: ${{ inputs.theme-repository != '' }}
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.theme-repository }}
        ref: ${{ inputs.theme-ref }}
        path: ${{ inputs.theme-path }}
        token: ${{ inputs.theme-token != '' && inputs.theme-token || github.token }}
        persist-credentials: false

    - name: Compose project-docu paths
      id: project_docu
      shell: bash
      env:
        THEME_REPOSITORY: ${{ inputs.theme-repository }}
        THEME_PATH: ${{ inputs.theme-path }}
        PROJECT_DOCU_PATHS_INPUT: ${{ inputs.project-docu-paths }}
      run: |
        set -euo pipefail
        paths=()
        if [ -n "${THEME_REPOSITORY}" ]; then
          theme_path="${THEME_PATH:-.docu-builder-theme}"
          theme_path="${theme_path#./}"
          if [ ! -d "${GITHUB_WORKSPACE}/${theme_path}" ]; then
            echo "::error::theme-repository was set but checkout path is missing: ${theme_path}"
            exit 2
          fi
          paths+=("${theme_path}")
          echo "Using shared documentation theme from ${THEME_REPOSITORY} at ${theme_path}"
        fi

        # Preserve multi-line / comma / space lists from the input.
        while IFS= read -r line || [ -n "${line}" ]; do
          line="$(echo "${line}" | xargs)"
          [ -z "${line}" ] && continue
          # Avoid duplicating the theme path if the caller already listed it.
          skip=0
          for existing in "${paths[@]:-}"; do
            if [ "${existing}" = "${line}" ] || [ "${existing}" = "./${line}" ] || [ "./${existing}" = "${line}" ]; then
              skip=1
              break
            fi
          done
          [ "${skip}" -eq 1 ] && continue
          paths+=("${line}")
        done < <(printf '%s\n' "${PROJECT_DOCU_PATHS_INPUT:-}" | tr ',;' '\n')

        composed=""
        if [ "${#paths[@]}" -gt 0 ]; then
          composed="$(printf '%s\n' "${paths[@]}")"
        fi
        {
          echo "paths<<EOF"
          printf '%s\n' "${composed}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"
        if [ -n "${composed}" ]; then
          echo "Resolved project-docu-paths:"
          printf '%s\n' "${composed}"
        else
          echo "No external project-docu-paths configured"
        fi

    - name: Run docs build via public npm package
      id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PROJECT_PATH: ${{ inputs.path }}
        COMPANY_NAME_INPUT: ${{ inputs.company-name }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        OA_VERSION: ${{ inputs.winccoa-version }}
        DOCKER_IMAGE: ${{ inputs.docker-image }}
        REGISTER_PROJECT: ${{ inputs.register-project }}
        TIMEOUT_MS: ${{ inputs.timeout-ms }}
        PACKAGE_VERSION: ${{ inputs.package-version }}
        NODE_VERSION: ${{ inputs.node-version }}
        LANGUAGES: ${{ inputs.languages }}
        PROJECT_DOCU_PATHS: ${{ steps.project_docu.outputs.paths }}
        LOG_PATH: ${{ inputs.log-path }}
        WARNING_OUTPUT_FILE: ${{ inputs.warning-output-file }}
        INSTALL_DOC_TOOLING: ${{ inputs.install-doc-tooling }}
        ANNOTATE_WARNINGS: ${{ inputs.annotate-warnings }}
        MAX_WARNING_COUNT: ${{ inputs.max-warning-count }}
        MAX_ANNOTATIONS: ${{ inputs.max-annotations }}
        INSTALL_DOXYGEN: ${{ inputs.install-doxygen }}
      run: bash "${{ github.action_path }}/scripts/run.sh"
